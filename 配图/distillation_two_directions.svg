<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580">
  <title>双向蒸馏的两个方向</title>
  <rect x="0" y="0" width="1080" height="580" fill="#ffffff"/>

  <!-- 顶部：经验源头 -->
  <rect x="340" y="22" width="400" height="84" rx="18" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <text x="540" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#1e293b">交付中摸索的经验</text>

  <!-- 左右分流箭头 -->
  <path d="M 450 108 C 450 148, 240 148, 240 172" fill="none" stroke="#1a6fe8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="240,194 229,175 251,175" fill="#1a6fe8"/>
  <path d="M 630 108 C 630 148, 840 148, 840 172" fill="none" stroke="#f5810c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="840,194 829,175 851,175" fill="#f5810c"/>
  <text x="338" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#1a6fe8">蒸馏</text>
  <text x="742" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#f5810c">蒸馏</text>

  <!-- 左卡片：面向客户蒸馏 -->
  <rect x="30" y="192" width="420" height="308" rx="14" fill="#eaf3fe" stroke="#1a6fe8" stroke-width="2.5"/>
  <path d="M 30 206 a 14 14 0 0 1 14 -14 h 392 a 14 14 0 0 1 14 14 v 54 h -420 Z" fill="#1a6fe8"/>
  <rect x="30" y="192" width="420" height="308" rx="14" fill="none" stroke="#1a6fe8" stroke-width="2.5"/>
  <text x="240" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">面向客户蒸馏</text>
  <text x="240" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">客户能自主迭代的操作资产</text>
  <line x1="70" y1="368" x2="410" y2="368" stroke="#b9d4f8" stroke-width="2"/>
  <text x="240" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#334155">运维手册 · 调优指南 · 提问模板</text>

  <!-- 右卡片：面向产品蒸馏 -->
  <rect x="630" y="192" width="420" height="308" rx="14" fill="#fdf3e7" stroke="#f5810c" stroke-width="2.5"/>
  <path d="M 630 206 a 14 14 0 0 1 14 -14 h 392 a 14 14 0 0 1 14 14 v 54 h -420 Z" fill="#f5810c"/>
  <rect x="630" y="192" width="420" height="308" rx="14" fill="none" stroke="#f5810c" stroke-width="2.5"/>
  <text x="840" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">面向产品蒸馏</text>
  <text x="840" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">跨项目复用的能力资产</text>
  <line x1="670" y1="368" x2="1010" y2="368" stroke="#f5d9b8" stroke-width="2"/>
  <text x="840" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#334155">Skill 模板 · 最佳实践 · 踩坑库</text>

  <!-- 底部结论 -->
  <text x="540" y="552" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e293b">双向缺一不可：客户能自主跑，团队拿到可复用资产</text>
</svg>
