<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 960 640">
  <title>Agent/Runtime/Session关系</title>
  
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-family="system-ui, sans-serif" 
        font-size="22" font-weight="700" fill="#1e293b">Agent / Runtime / Session 关系图</text>
  
  <!-- 最外层: Agent -->
  <rect x="100" y="80" width="760" height="480" rx="16" 
        fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="130" y="115" font-family="system-ui, sans-serif" 
        font-size="18" font-weight="700" fill="#1e40af">Agent (智能体)</text>
  <text x="130" y="140" font-size="12" fill="#64748b">定义：封装了专家角色、技能集合、连接器的智能实体</text>
  
  <!-- 中间层: Runtime -->
  <rect x="140" y="170" width="680" height="340" rx="12" 
        fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="170" y="200" font-family="system-ui, sans-serif" 
        font-size="16" font-weight="700" fill="#047857">Runtime (运行时)</text>
  <text x="170" y="220" font-size="11" fill="#64748b">定义：Agent的一次实例化运行环境，管理配置和状态</text>
  
  <!-- 最内层: Session -->
  <rect x="180" y="250" width="600" height="220" rx="10" 
        fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="280" font-family="system-ui, sans-serif" 
        font-size="14" font-weight="700" fill="#b45309">Session (会话)</text>
  <text x="210" y="300" font-size="10" fill="#64748b">定义：Runtime中的单次对话上下文，包含历史消息</text>
  
  <!-- Session内的对话示例 -->
  <rect x="200" y="320" width="250" height="35" rx="4" fill="#ffffff" stroke="#f59e0b"/>
  <text x="210" y="343" font-size="10" fill="#b45309">Session 1: 财务审核对话</text>
  
  <rect x="200" y="365" width="250" height="35" rx="4" fill="#ffffff" stroke="#f59e0b"/>
  <text x="210" y="388" font-size="10" fill="#b45309">Session 2: 报表生成对话</text>
  
  <rect x="200" y="410" width="250" height="35" rx="4" fill="#ffffff" stroke="#f59e0b"/>
  <text x="210" y="433" font-size="10" fill="#b45309">Session 3: 数据查询对话</text>
  
  <!-- 右侧说明 -->
  <rect x="480" y="320" width="280" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="345" font-size="11" font-weight="600" fill="#1e293b">层级关系</text>
  <text x="500" y="370" font-size="10" fill="#64748b">1 Agent 可创建 N 个 Runtime</text>
  <text x="500" y="390" font-size="10" fill="#64748b">1 Runtime 可包含 N 个 Session</text>
  <text x="500" y="410" font-size="10" fill="#64748b">Session 彼此独立，上下文隔离</text>
  <text x="500" y="430" font-size="10" fill="#64748b">Runtime 复用 Agent 配置</text>
  
  <!-- 底部说明 -->
  <text x="480" y="590" text-anchor="middle" font-family="system-ui, sans-serif" 
        font-size="11" fill="#64748b">Agent(1) → Runtime(N) → Session(N) 三层嵌套结构</text>
</svg>
