<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-label="Land and Expand：一个场景长成一个生态" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>Land and Expand：一个场景长成一个生态</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <defs>
    <linearGradient id="gScale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <text x="440" y="44" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">Land and Expand：一个场景长成一个生态</text>
  <rect x="30" y="431" width="150" height="74" rx="37" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="105" y="463" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">Land 落地</text>
  <text x="105" y="485" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">走完 PEV 到 L3</text>
  <rect x="212" y="329" width="156" height="176" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="290" y="367" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Consolidate 巩固</text>
  <text x="290" y="399" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">稳定运行 2-4 周</text>
  <text x="290" y="421" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">收集反馈，修边界 case</text>
  <rect x="394" y="267" width="156" height="238" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="472" y="305" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Expand 扩展</text>
  <text x="472" y="337" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">加第二个场景</text>
  <text x="472" y="359" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">走一个迷你 PEV</text>
  <text x="472" y="381" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">检查：老场景指标复测</text>
  <rect x="576" y="175" width="274" height="330" rx="12" fill="url(#gScale)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="713" y="213" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Scale 扩规模</text>
  <text x="713" y="245" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">从试点团队扩展到</text>
  <text x="713" y="267" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">更大范围</text>
  <text x="713" y="289" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">问题分布会变</text>
  <text x="713" y="311" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">边界 case 会变</text>
  <text x="713" y="333" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">采纳率可能下降</text>
  <path d="M180 468 H196 V417 H206" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M368 417 H381 V365 H388" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M550 365 H563 V325 H570" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <rect x="48" y="532" width="784" height="56" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="440" y="566" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">稳定运行期不是可选项——跳过 Consolidate，Expand 必翻车</text>
</svg>
