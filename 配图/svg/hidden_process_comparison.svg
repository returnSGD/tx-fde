<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" role="img" aria-label="设备报修：SOP 写的 vs 实际走的" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>设备报修：SOP 写的 vs 实际走的</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="440" y="46" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">设备报修：SOP 写的 vs 实际走的</text>
  <rect x="28" y="72" width="400" height="518" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="452" y="72" width="400" height="518" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="228" y="106" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">SOP 写的（显性流程）</text>
  <text x="652" y="106" font-size="14.5" font-weight="700" fill="#d97706" text-anchor="middle">实际走的（隐性流程）</text>
  <rect x="52" y="138" width="352" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="228" y="178" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">发现设备异常 → 拍照填表</text>
  <rect x="52" y="242" width="352" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="228" y="282" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">班组长审核 → 派工单</text>
  <rect x="52" y="346" width="352" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="228" y="386" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">维修组接单 → 上门处理</text>
  <rect x="52" y="450" width="352" height="64" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="228" y="490" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">处理完成 → 填完工单 → 闭环</text>
  <path d="M228 204 V 238" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M228 308 V 342" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M228 412 V 446" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <rect x="476" y="138" width="352" height="76" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="652" y="170" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">发现异常，分两类走</text>
  <text x="652" y="194" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">A 类走系统 ｜ B 类直接打电话给老王</text>
  <rect x="476" y="254" width="352" height="76" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="652" y="286" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">老王排工，凭经验</text>
  <text x="652" y="310" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">看描述定紧急度，口头通知不进系统</text>
  <rect x="476" y="370" width="352" height="76" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="652" y="402" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">维修处理，口头回告</text>
  <text x="652" y="426" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">完工告知老王 → 老王通知一线开工</text>
  <rect x="476" y="486" width="352" height="76" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="652" y="518" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">系统补单（忘了就没）</text>
  <text x="652" y="542" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="middle">为合规后补工单，数据失真</text>
  <path d="M652 216 V 250" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M652 332 V 366" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M652 448 V 482" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <rect x="52" y="612" width="776" height="60" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="440" y="648" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">AI 要切入的是右边——隐性流程才是真实工作发生的地方</text>
</svg>
