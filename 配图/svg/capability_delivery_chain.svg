<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="能力交付四步链路：上传、分类、策略、到人，四步缺一不可">
  <defs>
    <marker id="stepArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <g>
      <rect x="20" y="70" width="200" height="200" rx="14" fill="#2563eb"/>
      <circle cx="56" cy="116" r="15" fill="#ffffff"/>
      <text x="56" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">1</text>
      <path d="M 125 118 v 7 a 3 3 0 0 0 3 3 h 24 a 3 3 0 0 0 3 -3 v -7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 140 125 V 104" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 132 112 L 140 104 L 148 112" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="196" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">上传</text>
      <text x="120" y="226" text-anchor="middle" font-size="12" fill="#dbeafe">导入 Skill · 专家 · 知识库</text>
    </g>
    <g>
      <rect x="260" y="70" width="200" height="200" rx="14" fill="#2563eb"/>
      <circle cx="296" cy="116" r="15" fill="#ffffff"/>
      <text x="296" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">2</text>
      <path d="M 376 103 h 11 a 3 3 0 0 1 3 3 v 11 l -13 13 l -14 -14 z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="384" cy="111" r="2.2" fill="#ffffff"/>
      <text x="360" y="196" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">分类</text>
      <text x="360" y="226" text-anchor="middle" font-size="12" fill="#dbeafe">打标签 · 分组</text>
    </g>
    <g>
      <rect x="500" y="70" width="200" height="200" rx="14" fill="#2563eb"/>
      <circle cx="536" cy="116" r="15" fill="#ffffff"/>
      <text x="536" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">3</text>
      <path d="M 620 102 l 12 4 v 10 c 0 8 -5 13 -12 16 c -7 -3 -12 -8 -12 -16 v -10 z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 615 117 l 4 4 l 7 -8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="600" y="196" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">策略</text>
      <text x="600" y="226" text-anchor="middle" font-size="12" fill="#dbeafe">黑名单 · 白名单 · 默认允许</text>
    </g>
    <g>
      <rect x="740" y="70" width="200" height="200" rx="14" fill="#2563eb"/>
      <circle cx="776" cy="116" r="15" fill="#ffffff"/>
      <text x="776" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">4</text>
      <circle cx="855" cy="109" r="5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M 843 127 a 12 12 0 0 1 24 0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="872" cy="113" r="3.6" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M 866 127 a 7 7 0 0 1 13 0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="840" y="196" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">到人</text>
      <text x="840" y="226" text-anchor="middle" font-size="12" fill="#dbeafe">成员客户端可见可用</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.6">
      <path d="M 226 170 L 254 170" marker-end="url(#stepArrow)"/>
      <path d="M 466 170 L 494 170" marker-end="url(#stepArrow)"/>
      <path d="M 706 170 L 734 170" marker-end="url(#stepArrow)"/>
    </g>
    <text x="480" y="326" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">四步缺一不可，策略配置是最容易出问题的一步</text>
