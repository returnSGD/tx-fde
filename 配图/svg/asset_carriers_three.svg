<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="沉淀载体三件套：Skill 库对应通用方法、资料库对应客户特化、踩坑库对应踩坑经验，各有可见性规则">
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="440" y="52" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">沉淀载体三件套</text>
    <g>
      <text x="160" y="82" text-anchor="middle" font-size="12" fill="#64748b">通用方法</text>
      <rect x="40" y="92" width="240" height="366" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="160" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="#2563eb">Skill 库</text>
      <rect x="56" y="156" width="208" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="160" y="177" text-anchor="middle" font-size="13" fill="#0f172a">· 通用方法</text>
      <rect x="56" y="194" width="208" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="160" y="215" text-anchor="middle" font-size="13" fill="#0f172a">· 流程编排</text>
      <rect x="56" y="232" width="208" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="160" y="253" text-anchor="middle" font-size="13" fill="#0f172a">· 判断逻辑</text>
      <text x="160" y="296" text-anchor="middle" font-size="12" fill="#475569">结构化 · 可版本管理</text>
      <text x="160" y="316" text-anchor="middle" font-size="12" fill="#475569">可被 Agent 直接调用</text>
      <rect x="56" y="392" width="208" height="38" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="160" y="416" text-anchor="middle" font-size="12" fill="#0f172a">可见性：团队公共</text>
    </g>
    <g>
      <text x="440" y="82" text-anchor="middle" font-size="12" fill="#64748b">客户特化</text>
      <rect x="320" y="92" width="240" height="366" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="440" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="#d97706">资料库</text>
      <rect x="336" y="156" width="208" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="440" y="177" text-anchor="middle" font-size="13" fill="#0f172a">· 客户特化配置</text>
      <rect x="336" y="194" width="208" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="440" y="215" text-anchor="middle" font-size="13" fill="#0f172a">· 参数表</text>
      <rect x="336" y="232" width="208" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="440" y="253" text-anchor="middle" font-size="13" fill="#0f172a">· 客户业务规则</text>
      <text x="440" y="296" text-anchor="middle" font-size="12" fill="#475569">按客户 / 项目隔离</text>
      <text x="440" y="316" text-anchor="middle" font-size="12" fill="#475569">权限管控 · 半结构化</text>
      <rect x="336" y="392" width="208" height="38" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="440" y="416" text-anchor="middle" font-size="12" fill="#0f172a">可见性：客户 A 看不到客户 B</text>
    </g>
    <g>
      <text x="720" y="82" text-anchor="middle" font-size="12" fill="#64748b">踩坑经验</text>
      <rect x="600" y="92" width="240" height="366" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
      <text x="720" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="#059669">踩坑库</text>
      <rect x="616" y="156" width="208" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="720" y="177" text-anchor="middle" font-size="13" fill="#0f172a">· 踩坑记录</text>
      <rect x="616" y="194" width="208" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="720" y="215" text-anchor="middle" font-size="13" fill="#0f172a">· 边界情况</text>
      <rect x="616" y="232" width="208" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="720" y="253" text-anchor="middle" font-size="13" fill="#0f172a">· 临时修正</text>
      <text x="720" y="296" text-anchor="middle" font-size="12" fill="#475569">轻量卡片 · 随手记</text>
      <text x="720" y="316" text-anchor="middle" font-size="12" fill="#475569">按场景检索</text>
      <rect x="616" y="392" width="208" height="38" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="720" y="416" text-anchor="middle" font-size="12" fill="#0f172a">可见性：团队公共</text>
    </g>
    <rect x="40" y="486" width="800" height="44" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="440" y="514" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">三种载体不是选一种，而是三种都要有——但不要把三类内容混装</text>
  </g>
</svg>
