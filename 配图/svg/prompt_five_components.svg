  <path d="M217 368 H363 V412 A12 12 0 0 1 351 424 H229 A12 12 0 0 1 217 412 Z" fill="#2563eb"/>
  <text x="290" y="404" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">指令任务</text>

  <!-- 约束边界 -->
  <rect x="407" y="56" width="146" height="368" rx="12" fill="url(#gg)" stroke="#e2e8f0"/>
