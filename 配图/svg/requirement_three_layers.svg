<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="三层下挖法：从流程节点到真实用户，再到可量化成功标准" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="360" y="46" text-anchor="middle" font-size="18" font-weight="600" fill="#2563eb">三层下挖法</text>

  <rect x="60" y="76" width="600" height="96" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="360" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">第一层：哪一步出问题？</text>
  <text x="360" y="140" text-anchor="middle" font-size="13" fill="#475569">把「智能客服」这种笼统词，逼成流程图上的具体节点</text>

  <path d="M360 174 V198" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="60" y="204" width="600" height="96" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">第二层：谁真的在用？</text>
  <text x="360" y="268" text-anchor="middle" font-size="13" fill="#475569">挖到每天实际操作的真实用户，不是部门负责人</text>

  <path d="M360 302 V326" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="60" y="332" width="600" height="96" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="360" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">第三层：什么算成功？</text>
  <text x="360" y="396" text-anchor="middle" font-size="13" fill="#475569">量化衡量标准——没有成功标准的访谈等于没访谈</text>

  <rect x="145" y="470" width="430" height="52" rx="26" fill="#fffbeb" stroke="#fde68a"/>
  <text x="360" y="501" text-anchor="middle" font-size="14" fill="#d97706">挖到业务 SOP 为止，才算把需求问清楚</text>
</svg>
