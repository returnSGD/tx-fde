<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-label="三态溯源：每条输出都标明证据状态" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>三态溯源：每条输出都标明证据状态</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <text x="440" y="46" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">三态溯源：每条输出都标明证据状态</text>
  <rect x="28" y="78" width="264" height="386" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="116" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">① 知识库实证</text>
  <text x="160" y="170" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">来自客户文档/制度/案例</text>
  <text x="160" y="194" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">可点击回溯到原文</text>
  <rect x="48" y="228" width="224" height="88" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="160" y="262" font-size="13.5" font-weight="700" fill="#059669" text-anchor="middle">可信度最高</text>
  <text x="160" y="286" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">可直接用于决策</text>
  <text x="160" y="366" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">例：报销比例以员工手册</text>
  <text x="160" y="388" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">第 3.2 节为准</text>
  <rect x="308" y="78" width="264" height="386" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="116" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">② 接口实证</text>
  <text x="440" y="170" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">业务系统实时返回</text>
  <text x="440" y="194" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">可复查调用记录</text>
  <rect x="328" y="228" width="224" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="440" y="262" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">可信度高</text>
  <text x="440" y="286" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">注意时效与权限</text>
  <text x="440" y="366" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">例：剩余年假以 HR 系统</text>
  <text x="440" y="388" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">查询接口返回为准</text>
  <rect x="588" y="78" width="264" height="386" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="720" y="116" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">③ AI 推断</text>
  <text x="720" y="170" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">模型通用知识生成</text>
  <text x="720" y="194" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">无客户侧证据支撑</text>
  <rect x="608" y="228" width="224" height="88" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="720" y="262" font-size="13.5" font-weight="700" fill="#dc2626" text-anchor="middle">必须显式标注</text>
  <text x="720" y="286" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">禁止与实证混排</text>
  <text x="720" y="366" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">例：「我没有该客户的</text>
  <text x="720" y="388" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">相关规定，建议人工确认」</text>
  <rect x="44" y="492" width="792" height="54" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="440" y="525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">把推断当实证呈现，是最快摧毁信任的方式——抓到一次编数，之后做得再好他都不信</text>
</svg>
