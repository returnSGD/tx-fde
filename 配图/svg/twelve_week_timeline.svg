      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="480" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#2563eb">12 周节奏：四阶段 + 四道 Gate</text>

  <path d="M270 94 V368" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.85"/>
