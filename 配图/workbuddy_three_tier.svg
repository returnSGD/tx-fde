<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 960 640">
  <title>WorkBuddy三端架构</title>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-family="system-ui, sans-serif" 
        font-size="22" font-weight="700" fill="#1e293b">WorkBuddy 三端架构</text>
  
  <!-- 客户端层 -->
  <g class="client-layer">
    <rect x="80" y="80" width="800" height="120" rx="12" 
          fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="110" font-family="system-ui, sans-serif" 
          font-size="16" font-weight="700" fill="#1e40af">客户端 (Client)</text>
    <text x="100" y="135" font-family="system-ui, sans-serif" 
          font-size="12" fill="#64748b">用户交互界面 · 任务执行 · 本地技能</text>
    
    <rect x="120" y="150" width="140" height="35" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="190" y="173" text-anchor="middle" font-size="12" fill="#1e40af">桌面应用</text>
    
    <rect x="280" y="150" width="140" height="35" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="350" y="173" text-anchor="middle" font-size="12" fill="#1e40af">Web浏览器</text>
    
    <rect x="440" y="150" width="140" height="35" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="510" y="173" text-anchor="middle" font-size="12" fill="#1e40af">小程序</text>
    
    <rect x="600" y="150" width="140" height="35" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="670" y="173" text-anchor="middle" font-size="12" fill="#1e40af">移动端</text>
  </g>
  
  <!-- 连接箭头 -->
  <line x1="480" y1="200" x2="480" y2="250" stroke="#94a3b8" stroke-width="2" 
        marker-end="url(#arrow)"/>
  <text x="500" y="230" font-size="11" fill="#64748b">API调用</text>
  
  <!-- 企业管理后台层 -->
  <g class="admin-layer">
    <rect x="80" y="260" width="800" height="120" rx="12" 
          fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="100" y="290" font-family="system-ui, sans-serif" 
          font-size="16" font-weight="700" fill="#0e7490">企业管理后台 (Admin)</text>
    <text x="100" y="315" font-family="system-ui, sans-serif" 
          font-size="12" fill="#64748b">企业配置 · 权限管理 · 数据统计</text>
    
    <rect x="120" y="330" width="140" height="35" rx="6" fill="#ffffff" stroke="#0891b2"/>
    <text x="190" y="353" text-anchor="middle" font-size="12" fill="#0e7490">用户管理</text>
    
    <rect x="280" y="330" width="140" height="35" rx="6" fill="#ffffff" stroke="#0891b2"/>
    <text x="350" y="353" text-anchor="middle" font-size="12" fill="#0e7490">技能审核</text>
    
    <rect x="440" y="330" width="140" height="35" rx="6" fill="#ffffff" stroke="#0891b2"/>
    <text x="510" y="353" text-anchor="middle" font-size="12" fill="#0e7490">积分管理</text>
    
    <rect x="600" y="330" width="140" height="35" rx="6" fill="#ffffff" stroke="#0891b2"/>
    <text x="670" y="353" text-anchor="middle" font-size="12" fill="#0e7490">数据看板</text>
  </g>
  
  <!-- 连接箭头 -->
  <line x1="480" y1="380" x2="480" y2="430" stroke="#94a3b8" stroke-width="2" 
        marker-end="url(#arrow)"/>
  <text x="500" y="410" font-size="11" fill="#64748b">配置下发</text>
  
  <!-- WMA层 -->
  <g class="wma-layer">
    <rect x="80" y="440" width="800" height="120" rx="12" 
          fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="470" font-family="system-ui, sans-serif" 
          font-size="16" font-weight="700" fill="#b45309">WMA (WorkBuddy Managed Agents)</text>
    <text x="100" y="495" font-family="system-ui, sans-serif" 
          font-size="12" fill="#64748b">云端托管的智能体运行服务</text>
    
    <rect x="120" y="510" width="140" height="35" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="190" y="533" text-anchor="middle" font-size="12" fill="#b45309">7×24 运行</text>
    
    <rect x="280" y="510" width="140" height="35" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="350" y="533" text-anchor="middle" font-size="12" fill="#b45309">数据不出域</text>
    
    <rect x="440" y="510" width="140" height="35" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="510" y="533" text-anchor="middle" font-size="12" fill="#b45309">可评测</text>
    
    <rect x="600" y="510" width="140" height="35" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="670" y="533" text-anchor="middle" font-size="12" fill="#b45309">可 API 集成</text>
  </g>
  
  <!-- 底部说明 -->
  <text x="480" y="600" text-anchor="middle" font-family="system-ui, sans-serif" 
        font-size="11" fill="#64748b">三端协同：客户端负责交互，管理后台负责平台治理，WMA 负责云端托管运行</text>
</svg>
